[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypi-sdk.space"
version = "0.1.0"
description = "Your description here"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
authors = [{ name = "thanabartbb" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.scripts]
pypi-space = "pypi_sdk_space.cli:app"

[project.urls]
"Homepage" = "https://github.com/agents-sdk-space/pypi-sdk.space"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/pypi_sdk_space/cli.py" = ["UP042"]
"src/pypi_sdk_space/project.py" = ["UP036"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
